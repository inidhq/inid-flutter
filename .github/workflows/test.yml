name: test
on:
  pull_request:
  push:
    branches-ignore: [main]  # main: release.yml runs these first
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos  # infos: APIs newer Flutters deprecate, still needed for 3.19
      - run: flutter test
